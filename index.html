<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12324a"><script>try{if(localStorage.getItem("radar-theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
<title>رادار ایده</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#f3f6f9; --surface:#fff; --surface-2:#f7f9fb; --fg:#10212e; --muted:#5a6c7a; --line:#dce4ea; --line-strong:#b9c7d1;
  --navy:#12324a; --navy-2:#1b4766; --accent:#0c8686; --accent-2:#0a6f6f; --accent-soft:#dcf1f0; --accent-fg:#fff;
  --good:#16764d; --good-bg:#e0f3ea; --warn:#8f5400; --warn-bg:#fcefd0; --bad:#b3261e; --bad-bg:#fbe3e1; --info:#1a5aa0; --info-bg:#e1ecf8; --na:#4d5f6d; --na-bg:#e8eef2;
  --shadow:0 1px 2px rgba(16,33,46,.06),0 6px 18px rgba(16,33,46,.06); --shadow-up:0 2px 4px rgba(16,33,46,.08),0 12px 28px rgba(16,33,46,.10);
  --r:16px; color-scheme:light; --font:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.75}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- layout ---------- */
.shell{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.15)}

.topin{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:#fff}
.brand svg{width:32px;height:32px}
.nav{display:flex;gap:4px;margin-inline-start:8px}
.nav a{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;color:#d6e6f1;font-weight:500;transition:background .15s}
.nav a:hover{background:rgba(255,255,255,.1)}
.nav a[aria-current="page"]{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
.who{margin-inline-start:auto;display:flex;align-items:center;gap:10px;font-size:13.5px;color:#cfe0ec}
.who .nm{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbtn{background:none;border:0;color:#fff;cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px}
.linkbtn:hover{background:rgba(255,255,255,.12)}
main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:22px 16px 60px}
.tabbar{display:none}
@media(max-width:820px){
  .nav,.who .nm{display:none}
  main{padding:16px 14px calc(92px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.06)}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:6px 2px;border-radius:10px;min-width:0}
  .tabbar a[aria-current="page"]{color:var(--accent);font-weight:700;background:var(--accent-soft)}
  .tabbar svg{width:23px;height:23px}
}
h1{font-size:23px;margin:0;color:var(--navy);font-weight:800}
h2{font-size:17px;margin:0;color:var(--navy);font-weight:800}
h3{margin:0;font-size:16.5px;font-weight:700}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sub{color:var(--muted);font-size:13.5px;margin:2px 0 0}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:9px 18px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:700;font-size:14.5px;transition:transform .12s,box-shadow .12s,background .12s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13.5px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-weight:700;font-size:14px}
.opt{font-weight:400;color:var(--muted);font-size:12.5px;margin-inline-start:6px}
.req{color:var(--bad);margin-inline-start:3px}
.in{width:100%;min-height:46px;padding:9px 13px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface-2);transition:border-color .12s,box-shadow .12s}
textarea.in{min-height:90px;resize:vertical}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
.in.bad{border-color:var(--bad)}
.hint{color:var(--muted);font-size:12.8px;margin:0}
.err{color:var(--bad);font-size:13px;font-weight:500;margin:0}
.unit{display:flex;align-items:stretch}
.unit .in{border-start-end-radius:0;border-end-end-radius:0;direction:ltr;text-align:left}
.unit span{display:flex;align-items:center;padding:0 12px;background:var(--na-bg);border:1px solid var(--line-strong);border-inline-end:0;border-start-start-radius:11px;border-end-start-radius:11px;color:var(--muted);font-size:13px;white-space:nowrap}
.unit .in{border-radius:0 11px 11px 0}
[dir=rtl] .unit{flex-direction:row-reverse}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;font-size:14px;transition:all .12s}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}

.score{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.score button{min-height:46px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:700;font-size:16px;transition:all .12s}
.score button:hover{border-color:var(--accent)}
.score button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);transform:scale(1.04)}

/* ---------- cards & tiles ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media(max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--accent)}
.tile.t2::before{background:var(--warn)}.tile.t3::before{background:var(--good)}.tile.t4::before{background:var(--info)}
.tile b{font-size:30px;font-weight:800;color:var(--navy);line-height:1.2;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13.5px}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-radius:var(--r);padding:22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;box-shadow:var(--shadow-up)}

.hero h1{color:#fff;font-size:21px}.hero p{margin:4px 0 0;color:#cfe0ec;font-size:14px}
.hero .btn{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff}
.hero .btn.primary{background:var(--accent);border-color:var(--accent)}
.hero .btn:hover{background:rgba(255,255,255,.2)}.hero .btn.primary:hover{background:var(--accent-2)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.idea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s,border-color .16s;min-width:0}
.idea:hover{transform:translateY(-3px);box-shadow:var(--shadow-up);border-color:var(--accent)}
@media(prefers-reduced-motion:reduce){.idea,.btn,.score button{transition:none}.idea:hover{transform:none}}
.idea h3 a:hover{color:var(--accent)}
.idea .desc{margin:0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:4.5em}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.facts div{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.facts dt{font-size:12px;color:var(--muted)}.facts dd{margin:0;font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:2px 11px;border-radius:999px;white-space:nowrap}
.b-waiting{background:var(--warn-bg);color:var(--warn)}.b-voting{background:var(--info-bg);color:var(--info)}
.b-selected{background:var(--good-bg);color:var(--good)}.b-validating{background:var(--accent-soft);color:var(--accent)}
.b-launched{background:var(--good-bg);color:var(--good)}.b-paused,.b-archived{background:var(--na-bg);color:var(--na)}
.b-mine{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{justify-content:space-between}
.meter{height:8px;background:var(--na-bg);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:6px;transition:width .35s}
.res{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.res b{color:var(--fg);font-size:14px}
.mine-vote{font-size:12.5px;padding:2px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.mine-vote.none{background:var(--na-bg);color:var(--na);font-weight:500}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:32px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg)}
.note{border:1px solid var(--line);border-inline-start:4px solid var(--accent);background:var(--surface);padding:11px 14px;border-radius:10px;font-size:14px;display:flex;gap:9px;align-items:flex-start}
.note.warn{border-inline-start-color:var(--warn)}.note.bad{border-inline-start-color:var(--bad)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .in{max-width:260px;min-height:42px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .chip{min-height:36px;padding:4px 13px;font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.detail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:16px;align-items:start}
@media(max-width:900px){.detail{grid-template-columns:1fr}}
.sticky{position:sticky;top:76px}
@media(max-width:900px){.sticky{position:static}}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;margin:0}
.kv dt{color:var(--muted);font-size:13.5px}.kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:560px){.kv{grid-template-columns:1fr;gap:2px}.kv dt{margin-top:8px}}
.calc{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.calc .big{font-size:19px;font-weight:800;color:var(--accent)}
.calc small{color:var(--muted);font-size:12.5px}
details>summary{cursor:pointer;font-weight:700;color:var(--navy);padding:4px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:start;color:var(--muted);font-weight:500;font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tblw{overflow-x:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 16px;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--accent)}

/* ---------- auth ---------- */
.authwrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--navy) 0%,#0d2231 60%,#0a3b3b 100%)}
.authcard{width:100%;max-width:420px;background:var(--surface);border-radius:20px;padding:26px 22px;box-shadow:var(--shadow-up);display:flex;flex-direction:column;gap:16px}
.authcard .logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;color:var(--navy)}
.authcard .logo svg{width:40px;height:40px}

/* ---------- misc ---------- */
#toast{position:fixed;inset-inline:0;bottom:calc(90px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:80}
#toast div{background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;box-shadow:var(--shadow-up);font-size:14px;max-width:90vw;animation:up .2s}
#toast div.bad{background:var(--bad)}

@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ov{position:fixed;inset:0;background:rgba(8,18,26,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:90}
.dlg{background:var(--surface);border-radius:16px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.dlg p{margin:0;color:var(--muted)}
.skeleton{height:130px;border-radius:var(--r);background:linear-gradient(90deg,var(--na-bg),var(--surface-2),var(--na-bg));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- v2.1 visual layer ---------- */
:root{--bg:#f2f6f7;--sand:#fff6e4;--amber:#e39a2d}
body{background:radial-gradient(1200px 500px at 85% -10%,#e3f1f0 0%,transparent 60%),var(--bg)}
.hero{position:relative;overflow:hidden;padding:26px 28px;min-height:190px;background:linear-gradient(120deg,#0f2c42 0%,#15405a 55%,#0f5a5c 100%)}
.hero>div{position:relative;z-index:1}
.hero h1{font-size:25px;line-height:1.5}
.hero p{font-size:15px;max-width:34ch}
.hero .radar{position:absolute;inset-inline-end:-30px;top:50%;width:300px;height:300px;transform:translateY(-50%);z-index:0;opacity:.95}
.hero .radar .sweep{transform-origin:150px 150px;animation:sweep 9s linear infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
@media(max-width:820px){.hero{padding:20px}.hero .radar{width:220px;height:220px;inset-inline-end:-70px;opacity:.55}.hero h1{font-size:21px}}
@media(prefers-reduced-motion:reduce){.hero .radar .sweep{animation:none}}
.hero{flex-direction:column;align-items:flex-start;justify-content:center;gap:14px}
.hero .row{margin-top:2px}
.tile{padding:16px 16px 14px}
.tile::before{display:none}
.tile .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}
.tile.t2 .ic{background:#fdf0d6;color:var(--warn)}.tile.t4 .ic{background:var(--info-bg);color:var(--info)}.tile.t3 .ic{background:var(--good-bg);color:var(--good)}
.tile b{font-size:32px}
.idea{padding:0;overflow:hidden;gap:0}
.idea .art{display:block;width:100%;height:78px}
.idea .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.idea .badges{position:absolute;inset-inline:12px;top:10px;display:flex;justify-content:space-between;gap:8px}
.idea .top{position:relative}
.idea .badge{box-shadow:0 1px 3px rgba(16,33,46,.12);background-clip:padding-box}
.empty .art{width:150px;height:110px}
.authwrap{position:relative;overflow:hidden}
.authwrap::before{content:"";position:absolute;inset:0;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600' viewBox='0 0 600 600' fill='none' stroke='%233cc4bf' stroke-opacity='.14'><circle cx='300' cy='300' r='80'/><circle cx='300' cy='300' r='160'/><circle cx='300' cy='300' r='240'/><circle cx='300' cy='300' r='320'/><path d='M300 0v600M0 300h600'/></svg>") center/760px no-repeat;pointer-events:none}
.authcard{position:relative}

/* ---------- dark theme (user switch, default light) ---------- */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b151d; --surface:#122029; --surface-2:#0f1b24; --fg:#e8eff4; --muted:#9bb0be; --line:#253846; --line-strong:#3a5162;
  --navy:#9ccdee; --navy-2:#7fb9de; --accent:#3cc4bf; --accent-2:#5ad3ce; --accent-soft:#12383a; --accent-fg:#04211f;
  --good:#52c78e; --good-bg:#123425; --warn:#e8b25a; --warn-bg:#3b2d10; --bad:#ff948b; --bad-bg:#3e1b19; --info:#8ab9ee; --info-bg:#14273d; --na:#a2b4c0; --na-bg:#1b2c37;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-up:0 8px 24px rgba(0,0,0,.45)}
:root[data-theme="dark"] body{background:radial-gradient(1200px 500px at 85% -10%,#10303a 0%,transparent 60%),var(--bg)}
:root[data-theme="dark"] .topbar{background:#0a1a26}
:root[data-theme="dark"] .hero{background:linear-gradient(120deg,#0b2233 0%,#0f3347 55%,#0b3f41 100%)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#04211f}
:root[data-theme="dark"] #toast div{color:#04211f}
:root[data-theme="dark"] #toast div.bad{color:#2a0a08}
:root[data-theme="dark"] .tile.t2 .ic{background:#3b2d10;color:#e8b25a}
:root[data-theme="dark"] .authwrap{background:linear-gradient(160deg,#0b2233 0%,#08151f 60%,#073232 100%)}
:root[data-theme="dark"] .idea .badge{box-shadow:none}
:root[data-theme="dark"] .btn.danger{color:var(--bad)}
.themeseg{display:flex;gap:10px;flex-wrap:wrap}
.themeopt{flex:1;min-width:140px;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:2px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:700}
.themeopt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.themeopt i{width:34px;height:34px;border-radius:10px;border:1px solid var(--line-strong);display:block;flex:none}
.themeopt i.l{background:linear-gradient(135deg,#f2f6f7 50%,#fff 50%)}
.themeopt i.d{background:linear-gradient(135deg,#0b151d 50%,#122029 50%)}

/* ---------- race track (top ideas by participants) ---------- */
.racebox{margin-top:26px;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#bfe6f2 0%,#e6f6fb 46%,#7bc47f 46%,#6bb86f 100%);border:1px solid var(--line);box-shadow:var(--shadow-up)}
.racehead{padding:18px 20px 0;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;color:#10212e}
.racehead h2{color:#10212e;font-size:19px}.racehead p{margin:2px 0 0;font-size:13.5px;color:#34505f;max-width:52ch}
.racehead .cup{width:64px;height:64px;flex:none}
.crowd{display:block;width:100%;height:88px;margin-top:10px}
.track{position:relative;background:#c9573f;padding:8px 0;border-block:4px solid #fff;margin-top:-2px}
.lane{position:relative;display:flex;align-items:stretch;height:64px;border-bottom:2px dashed rgba(255,255,255,.75)}
.lane:last-child{border-bottom:0}
.lane::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:6px;background:#fff;opacity:.9}
.lbl{flex:none;width:clamp(112px,27%,230px);display:flex;align-items:center;gap:8px;padding:0 10px;background:rgba(16,33,46,.88);color:#fff;min-width:0;position:relative;z-index:2}
.lbl a{display:block;min-width:0}
.lbl b{display:block;font-size:13.5px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lbl small{display:block;color:#bcd2df;font-size:11.5px;white-space:nowrap}
.medal{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#10212e;border:2.5px solid #10212e;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.m1{background:#ffd34d}.m2{background:#dfe6ec}.m3{background:#e9a572}.m4,.m5{background:#fff}
.run{position:relative;flex:1;min-width:0}
.finish{position:absolute;inset-block:0;inset-inline-end:0;width:16px;background:repeating-conic-gradient(#fff 0 25%,#10212e 0 50%) 0 0/8px 8px}
.runner{position:absolute;top:2px;width:60px;height:60px;inset-inline-start:calc((100% - 96px) * var(--p) + 6px);animation:go 2.4s cubic-bezier(.22,.7,.2,1) both;animation-delay:calc(var(--n) * .12s)}
@keyframes go{from{inset-inline-start:6px}}
.runner svg{width:60px;height:60px;overflow:visible;transform:scaleX(-1)}
[dir=ltr] .runner svg{transform:none}
.runner .pa{animation:pa .24s steps(1) 10;animation-delay:calc(var(--n) * .12s)}
.runner .pb{opacity:0;animation:pb .24s steps(1) 10;animation-delay:calc(var(--n) * .12s)}
@keyframes pa{0%{opacity:1}50%{opacity:0}}
@keyframes pb{0%{opacity:0}50%{opacity:1}}
.runner .bob{animation:bob .24s ease-in-out 10 alternate;animation-delay:calc(var(--n) * .12s);transform-box:fill-box}
@keyframes bob{to{transform:translateY(-2px)}}
.runner .dust{animation:dust 2.4s ease-out both;animation-delay:calc(var(--n) * .12s)}
@keyframes dust{0%{opacity:.8}100%{opacity:0}}
.tag{position:absolute;top:-2px;inset-inline-start:calc((100% - 96px) * var(--p) + 62px);background:#fff;color:#10212e;border:2px solid #10212e;border-radius:10px;padding:0 8px;font-size:12px;font-weight:800;line-height:20px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.2);animation:go2 2.4s cubic-bezier(.22,.7,.2,1) both;animation-delay:calc(var(--n) * .12s)}
@keyframes go2{from{inset-inline-start:62px}}
.tag.back{inset-inline-start:calc((100% - 96px) * var(--p) - 52px);animation-name:go3}
@keyframes go3{from{inset-inline-start:-52px}}
.raceft{padding:12px 20px 16px;font-size:12.8px;color:#10361d;background:rgba(255,255,255,.55);backdrop-filter:blur(2px)}
.raceft b{color:#0a2a15}
@media(max-width:700px){.tag.back{inset-inline-start:calc((100% - 84px) * var(--p) - 50px)}.lbl{width:clamp(128px,38%,230px)}.lane{height:58px}.runner,.runner svg{width:52px;height:52px}.runner{inset-inline-start:calc((100% - 84px) * var(--p) + 4px)}.tag{inset-inline-start:calc((100% - 84px) * var(--p) + 54px);font-size:11px;line-height:18px}.lbl{padding:0 6px;gap:6px}.medal{width:26px;height:26px;font-size:12px}.racehead .cup{display:none}}
@media(prefers-reduced-motion:reduce){.runner,.tag,.runner .pa,.runner .pb,.runner .bob,.runner .dust{animation:none!important}.runner .pb{opacity:0}}
:root[data-theme="dark"] .racebox{background:linear-gradient(180deg,#14324a 0%,#1b4660 46%,#2f7a4c 46%,#286b42 100%)}
:root[data-theme="dark"] .racehead,:root[data-theme="dark"] .racehead h2{color:#fff}
:root[data-theme="dark"] .racehead p{color:#cfe0ec}
:root[data-theme="dark"] .raceft{background:rgba(8,18,26,.55);color:#d6efe0}
:root[data-theme="dark"] .raceft b{color:#fff}

function errText(e){
  var m=(e&&(e.message||e.error_description))||String(e||'');

  if(k)return ERR[k];

var IDEA_COLS='id,title,summary,problem,solution,target,product,advantage,industry,geo,capital_toman,price_per_unit,unit_cost,monthly_sales,status,archived,deep,created_at,updated_at';
async function loadProfile(){
  var r=await sb.from('profiles').select('*').eq('user_id',S.session.user.id).maybeSingle();

}
async function loadData(){
  var p=await Promise.all([
    sb.from('ideas').select(IDEA_COLS).order('created_at',{ascending:false}),
    sb.rpc('idea_results'),sb.rpc('my_idea_ids'),sb.rpc('my_profile'),sb.rpc('member_directory')]);

  if(p[3].error)throw p[3].error;if(p[4].error)throw p[4].error;

  S.ideas=p[0].data||[];

  S.mine={};(p[2].data||[]).forEach(function(id){S.mine[typeof id==='object'?(id.my_idea_ids||id.idea_id):id]=true});

async function loadAdmin(){
  if(!isAdmin())return;

    sb.from('profiles').select('*').order('created_at',{ascending:true}),
    sb.rpc('admin_legacy_members'),

async function refresh(){
  S.loaded=false;S.admin.loaded=false;

function crowdSvg(){
  var cols=['#e8590c','#2f8fe0','#9b51e0','#e0a800','#2fa36b','#d6336c','#1c7ed6','#f08c00'],o='',sk=['#f6c9a0','#e0a578','#c68a5c','#f9d9b8'],O='#10212e';

  for(var n=0;n<34;n++){var h=hash('crowd'+n),x2=14+n*29.4+(h%7),y=44+(h>>4)%16,c=cols[h%cols.length];
    o+='<g><path d="M'+(x2-11)+' 90 q0 -26 11 -26 q11 0 11 26z" fill="'+c+'" stroke="'+O+'" stroke-width="2"/><circle cx="'+x2+'" cy="'+(y+8)+'" r="8" fill="'+sk[h%4]+'" stroke="'+O+'" stroke-width="2"/>'+((h>>6)%3===0?'<path d="M'+(x2-9)+' 70 l-5 -14 M'+(x2+9)+' 70 l5 -14" stroke="'+O+'" stroke-width="3" stroke-linecap="round" fill="none"/>':'')+'</g>';}

function raceTrack(){
  var act=S.ideas.filter(function(i){return !i.archived});
  var R=function(i){return S.results[i.id]||{}};
  var top=act.slice().sort(function(a,b){var x=R(a),y=R(b);return (y.yes_count||0)-(x.yes_count||0)||(y.avg_interest||0)-(x.avg_interest||0)||(y.votes_count||0)-(x.votes_count||0)}).slice(0,5);
  if(!top.length)return '';
  var mx=Math.max.apply(null,top.map(function(i){return R(i).yes_count||0}));
  var lanes=top.map(function(i,n){
    var r=R(i),y=r.yes_count||0,p=mx?Math.max(.06,y/mx):0.0;
    return '<div class="lane" data-lane="'+esc(i.id)+'"><div class="lbl"><span class="medal m'+(n+1)+'">'+fa(n+1)+'</span><a href="#/idea/'+esc(i.id)+'"><b>'+esc(i.title)+'</b><small>'+fa(y)+' شریک · '+(r.votes_count?fa(r.avg_interest,1)+' از ۱۰':'بدون رأی')+'</small></a></div>'
     +'<div class="run" style="--p:'+p.toFixed(3)+';--n:'+n+'"><span class="finish"></span><div class="runner" title="'+esc(i.title)+'">'+runnerSvg(LANEC[n])+'</div><span class="tag'+(p>.5?' back':'')+'">'+fa(y)+' نفر</span></div></div>';
  }).join('');
  return '<section class="racebox" aria-label="مسابقه‌ی پنج ایده‌ی پرطرفدار"><div class="racehead"><div><h2>مسابقه‌ی ایده‌ها</h2><p>پنج ایده‌ای که بیشترین نفر گفته‌اند «شریک می‌شوم». هر چه ایده به خط پایان نزدیک‌تر باشد، همراه بیشتری دارد.</p></div>'+CUP+'</div>'
   +crowdSvg()+'<div class="track">'+lanes+'</div>'
   +'<div class="raceft">'+(mx?'ترتیب بر اساس <b>تعداد شرکت‌کنندگان</b>؛ در تساوی، میانگین علاقه‌ی ایده ملاک است. این نمودار تصمیم نهایی نیست، فقط نشان می‌دهد گروه کجا بیشتر هم‌نظر است.':'هنوز کسی «شریک می‌شوم» را انتخاب نکرده است. با رأی‌دادن و انتخاب این گزینه، مسابقه شروع می‌شود.')+'</div></section>';
}

    var st=stageOf(i).k;

      }).join('')+'</tbody></table></div>'
     +'<h2 style="margin-top:8px">پروفایل‌های قدیمی بدون حساب ('+fa(free.length)+')</h2>'
     +(free.length?'<div class="tblw"><table class="tbl"><thead><tr><th>نام</th><th>عنوان</th><th>رأی‌های قدیمی</th></tr></thead><tbody>'+free.map(function(m){return '<tr><td>'+esc(m.name)+'</td><td>'+esc(m.job_title||'—')+'</td><td>'+fa(A.legacy[m.id]||0)+'</td></tr>'}).join('')+'</tbody></table></div>':'<p class="hint">همه‌ی پروفایل‌های قدیمی به حساب وصل شده‌اند.</p>');
  }else if(t==='profiles'){
    var D=A.details,RL={};ROLES.forEach(function(r){RL[r[0]]=r[1]});
    var withP=D.filter(function(d){return d.status==='approved'&&(d.capital_toman!=null||d.risk!=null||d.job_title||d.interests)});
    var caps=D.filter(function(d){return d.capital_toman!=null}),rks=D.filter(function(d){return d.risk!=null});
    var sum=caps.reduce(function(a,d){return a+Number(d.capital_toman)},0),avg=rks.length?rks.reduce(function(a,d){return a+d.risk},0)/rks.length:null;
    body='<div class="tiles"><div class="tile"><b>'+fa(withP.length)+'</b><span>پروفایل پرشده</span></div><div class="tile t2"><b>'+(caps.length?esc(tomanShort(sum)):'—')+'</b><span>جمع سرمایه‌ی اعلام‌شده ('+fa(caps.length)+' نفر)</span></div><div class="tile t4"><b>'+(avg==null?'—':fa(avg,1))+'</b><span>میانگین ریسک‌پذیری از ۵</span></div></div>'
     +'<div class="tblw"><table class="tbl"><thead><tr><th>نام</th><th>تخصص</th><th>حوزه‌ها</th><th>نقش‌ها</th><th>ساعت/هفته</th><th>سرمایه</th><th>حداکثر زیان</th><th>ریسک</th><th>افق</th><th>ملاحظات</th></tr></thead><tbody>'
     +D.map(function(d){return '<tr><td><b>'+esc(d.display_name||'—')+'</b><br><span class="hint" dir="ltr">'+esc(d.email||'')+'</span></td><td>'+esc(d.job_title||'—')+'</td><td>'+esc(d.interests||'—')+'</td><td>'+esc((d.team_roles||[]).map(function(r){return RL[r]||r}).join('، ')||'—')+'</td><td>'+(d.hours_per_week==null?'—':fa(Number(d.hours_per_week)))+'</td><td>'+(d.capital_toman==null?'—':esc(tomanShort(Number(d.capital_toman))))+'</td><td>'+(d.max_loss_toman==null?'—':esc(tomanShort(Number(d.max_loss_toman))))+'</td><td>'+(d.risk==null?'—':fa(d.risk))+'</td><td>'+(d.horizon_months==null?'—':fa(d.horizon_months)+' ماه')+'</td><td>'+esc(d.constraints||'—')+'</td></tr>'}).join('')+'</tbody></table></div>'
     +'<p class="hint">این جمع‌ها فقط از اطلاعاتی است که اعضا خودشان وارد کرده‌اند؛ جای خالی یعنی هنوز وارد نشده، نه صفر.</p>';
  }else if(t==='audit'){
    var AL={user_status:'تغییر وضعیت حساب',link_member:'وصل پروفایل قدیمی',idea_status:'تغییر وضعیت ایده',idea_archived:'آرشیو ایده',idea_deep:'ذخیره‌ی بررسی تخصصی',assign_owner:'تعیین پیشنهاددهنده'};
    var nm={};A.users.forEach(function(u){nm[u.user_id]=u.display_name||u.email});
    body=A.audit.length?'<div class="tblw"><table class="tbl"><thead><tr><th>زمان</th><th>مدیر</th><th>اقدام</th><th>هدف</th></tr></thead><tbody>'+A.audit.map(function(a){return '<tr><td>'+esc(new Date(a.at).toLocaleString('fa-IR'))+'</td><td>'+esc(nm[a.actor]||'—')+'</td><td>'+esc(AL[a.action]||a.action)+'</td><td dir="ltr" style="text-align:right">'+esc(nm[a.target]||a.target||'')+'</td></tr>'}).join('')+'</tbody></table></div>':'<p class="hint">هنوز اقدامی ثبت نشده است.</p>';
  }else{
    body='<div class="tblw"><table class="tbl"><thead><tr><th>ایده</th><th>پیشنهاددهنده</th><th>رأی</th><th>میانگین</th><th>وضعیت</th></tr></thead><tbody>'
     +S.ideas.map(function(i){var o=A.owners[i.id]||{},r=S.results[i.id]||{},st=stageOf(i);
        return '<tr><td><a href="#/idea/'+esc(i.id)+'"><b>'+esc(i.title)+'</b></a></td><td>'+esc(o.owner_name||'نامشخص')+'</td><td>'+fa(r.votes_count||0)+'</td><td>'+(r.votes_count?fa(r.avg_interest,1):'—')+'</td><td><span class="badge b-'+st.k+'">'+esc(st.t)+'</span></td></tr>'}).join('')+'</tbody></table></div>';
  }
  return '<div class="pagehead"><div><h1>مدیریت</h1><p class="sub">'+(pend?'<b>'+fa(pend)+'</b> حساب منتظر تأیید است.':'حساب منتظر تأییدی وجود ندارد.')+'</p></div></div>'
   +'<div class="tabs" role="tablist"><button role="tab" data-act="atab" data-v="users" aria-selected="'+(t==='users')+'">حساب‌ها'+(pend?' ('+fa(pend)+')':'')+'</button><button role="tab" data-act="atab" data-v="ideas" aria-selected="'+(t==='ideas')+'">ایده‌ها و مالکیت</button><button role="tab" data-act="atab" data-v="profiles" aria-selected="'+(t==='profiles')+'">پروفایل اعضا</button><button role="tab" data-act="atab" data-v="audit" aria-selected="'+(t==='audit')+'">گزارش اقدام‌ها</button></div>'
   +'<div style="display:flex;flex-direction:column;gap:14px">'+body+'</div>';
}

/* ---------- ورود، انتظار، مسدود ---------- */
function vAuth(){
  var t=S.ui.authTab,up=t==='up';
  return '<div class="authwrap"><div class="authcard"><div class="logo">'+LOGO.replace('currentColor','#12324a')+'رادار ایده</div>'
   +'<p class="sub" style="margin:0">سامانه‌ی ثبت و رأی‌گیری ایده‌های کسب‌وکار گروه</p>'
   +'<div class="tabs" role="tablist" style="margin:0"><button role="tab" data-act="authtab" data-v="in" aria-selected="'+(!up)+'">ورود</button><button role="tab" data-act="authtab" data-v="up" aria-selected="'+up+'">ثبت‌نام</button></div>'
   +'<form id="authForm" style="display:flex;flex-direction:column;gap:12px" novalidate>'
   +(up?'<div class="field"><label class="lbl" for="a_name">نام و نام خانوادگی</label><input class="in" id="a_name" autocomplete="name" maxlength="80" required></div>':'')
   +'<div class="field"><label class="lbl" for="a_email">ایمیل</label><input class="in" id="a_email" type="email" dir="ltr" autocomplete="email" required></div>'
   +'<div class="field"><label class="lbl" for="a_pass">رمز عبور'+(up?' <span class="opt">دست‌کم ۸ نویسه</span>':'')+'</label><input class="in" id="a_pass" type="password" dir="ltr" autocomplete="'+(up?'new-password':'current-password')+'" required minlength="8"></div>'
   +(S.ui.authMsg?'<p class="'+(S.ui.authMsg.charAt(0)==='!'?'err':'hint')+'" role="alert">'+esc(S.ui.authMsg.replace(/^!/,''))+'</p>':'')
   +'<button class="btn primary block" type="submit" '+(S.ui.busy?'disabled':'')+'>'+(up?'ساخت حساب':'ورود')+'</button></form>'
   +(up?'<p class="hint">بعد از ثبت‌نام، حساب شما باید توسط مدیر تأیید شود.</p>':'')+'</div></div>';
}
function vPending(){
  var b=S.profile&&S.profile.status==='blocked';
  return '<div class="authwrap"><div class="authcard" style="text-align:center;align-items:center"><div class="logo">'+LOGO.replace('currentColor','#12324a')+'رادار ایده</div>'
   +'<h2>'+(b?'دسترسی حساب شما بسته شده است':'حساب شما منتظر تأیید مدیر است')+'</h2>'
   +'<p class="sub">'+(b?'برای اطلاعات بیشتر با مدیر گروه تماس بگیرید.':'بعد از تأیید، همه‌ی ایده‌ها را می‌بینید و می‌توانید رأی بدهید. نیازی به ثبت‌نام دوباره نیست.')+'</p>'
   +'<p class="hint" dir="ltr">'+esc((S.profile&&S.profile.email)||'')+'</p>'
   +'<div class="row" style="justify-content:center"><button class="btn primary" data-act="recheck">بررسی دوباره</button><button class="btn" data-act="logout">خروج</button></div></div></div>';
}

/* ================= مسیریابی و رندر ================= */
function route(){
  var h=(location.hash||'#/').replace(/^#\/?/,'').split('/');
  var n=h[0]||'';
  if(n==='ideas')return {name:'ideas'};
  if(n==='idea')return {name:'idea',id:decodeURIComponent(h[1]||'')};
  if(n==='new')return {name:'new'};
  if(n==='edit')return {name:'edit',id:decodeURIComponent(h[1]||'')};
  if(n==='admin')return {name:'admin'};
  if(n==='me')return {name:'me'};
  return {name:'home'};
}
function render(){
  var app=$('#app'),keepFocus=null;
  if(!S.session){app.innerHTML=vAuth();return}
  if(!S.profile){app.innerHTML='<div class="authwrap"><div class="authcard"><div class="skeleton"></div><p class="hint" style="text-align:center">در حال بارگذاری…</p></div></div>';return}
  if(S.profile.status!=='approved'){app.innerHTML=vPending();return}
  var r=route(),inner;
  if(!S.loaded){inner=skeletons()}
  else if(r.name==='ideas')inner=vIdeas();
  else if(r.name==='idea')inner=vIdea(r.id);
  else if(r.name==='new'){if(!S.ui.form||S.ui.formFor!=='new'){S.ui.form=formFrom(null);S.ui.formFor='new';S.ui.errors={}}inner=vForm(null)}
  else if(r.name==='edit'){
    var it=S.ideas.filter(function(x){return x.id===r.id})[0];
    if(!it)inner='<div class="empty"><b>ایده پیدا نشد</b></div>';
    else if(!((S.mine[it.id]&&it.status==='new')||isAdmin()))inner='<div class="empty"><b>این ایده را نمی‌توانید ویرایش کنید.</b><a class="btn" href="#/idea/'+esc(it.id)+'">بازگشت</a></div>';
    else{if(!S.ui.form||S.ui.formFor!==it.id){S.ui.form=formFrom(it);S.ui.formFor=it.id;S.ui.errors={}}inner=vForm(it)}
  }
  else if(r.name==='admin')inner=vAdmin();
  else if(r.name==='me')inner=vMe();
  else inner=vHome();
  if(r.name!=='new'&&r.name!=='edit'){S.ui.form=null;S.ui.formFor=null}
  app.innerHTML=shell(inner,r);
  if(r.name==='new'||r.name==='edit')liveCalc();
}
window.addEventListener('hashchange',function(){render();window.scrollTo(0,0)});

/* ================= رویدادها ================= */
document.addEventListener('click',async function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
  try{
    if(act==='logout'){await sb.auth.signOut();S.session=null;S.profile=null;S.ui.vote={};render();return}
    if(act==='recheck'){await refresh();return}
    if(act==='authtab'){S.ui.authTab=v;S.ui.authMsg='';render();return}
    if(act==='theme'){setTheme(v);render();return}
    if(act==='metab'){S.ui.metab=v;render();return}
    if(act==='prole'||act==='prisk'||act==='phz'){
      var dr=S.prof.draft;
      if(act==='prole'){var ix=dr.team_roles.indexOf(v);if(ix>=0)dr.team_roles.splice(ix,1);else dr.team_roles.push(v)}
      else if(act==='prisk')dr.risk=(dr.risk===Number(v)?0:Number(v));
      else dr.horizon_months=(dr.horizon_months===Number(v)?0:Number(v));
      var sc2=window.scrollY;render();window.scrollTo(0,sc2);return;
    }
    if(act==='filter'){S.ui.filter=v;render();return}
    if(act==='atab'){S.ui.tab=v;render();return}
    if(act==='score'||act==='join'){
      var rt=route(),d=S.ui.vote[rt.id]||(S.ui.vote[rt.id]={interest:null,join:''});
      if(act==='score')d.interest=Number(v);else d.join=(d.join===v?'':v);
      var sc=window.scrollY;render();window.scrollTo(0,sc);return;
    }
    if(act==='castVote'){
      var dv=S.ui.vote[id]||{};
      if(!dv.interest){toast('ابتدا امتیاز علاقه (۱ تا ۱۰) را انتخاب کنید.',true);return}
      S.ui.busy=true;render();
      var r1=await sb.rpc('cast_vote',{p_idea:id,p_interest:dv.interest,p_join:dv.join||null});S.ui.busy=false;
      if(r1.error)throw r1.error;
      toast('رأی شما ثبت شد.');await loadData();render();return;
    }
    if(act==='withdraw'){
      if(!await ask({title:'پس‌گرفتن رأی',msg:'رأی شما برای این ایده حذف می‌شود.',ok:'پس بگیر',danger:true}))return;
      var r2=await sb.rpc('withdraw_vote',{p_idea:id});if(r2.error)throw r2.error;
      delete S.ui.vote[id];toast('رأی شما پس گرفته شد.');await loadData();render();return;
    }
    if(act==='setUser'){
      var r3=await sb.rpc('admin_set_user_status',{p_user:id,p_status:v});if(r3.error)throw r3.error;
      toast(v==='approved'?'حساب تأیید شد.':'حساب مسدود شد.');await loadAdmin();render();return;
    }
    if(act==='archive'){
      var it=S.ideas.filter(function(x){return x.id===id})[0];
      var r4=await sb.rpc('admin_set_idea_archived',{p_idea:id,p_archived:!it.archived});if(r4.error)throw r4.error;
      toast(it.archived?'از آرشیو خارج شد.':'به آرشیو منتقل شد.');await loadData();render();return;
    }
  }catch(err){S.ui.busy=false;console.error(err);toast(errText(err),true);render()}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.pf&&S.prof.draft){S.prof.draft[t.dataset.pf]=t.value;return}
  if(t.id==='q'){S.ui.q=t.value;var pos=t.selectionStart;render();var n=$('#q');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}return}
  if(t.dataset&&t.dataset.f&&S.ui.form){
    S.ui.form[t.dataset.f]=t.value;
    if(S.ui.errors[t.dataset.f]){delete S.ui.errors[t.dataset.f];t.classList.remove('bad');var er=t.closest('.field').querySelector('.err');if(er)er.remove()}
    if(t.dataset.money){var lv=$('[data-live="'+t.dataset.f+'"]');var nn=normNum(t.value);if(lv)lv.textContent=nn?tomanShort(Number(nn)):''}
    liveCalc();
  }
});
document.addEventListener('change',async function(e){
  var t=e.target;
  try{
    if(t.id==='sortSel'){S.ui.sort=t.value;render();return}
    if(t.id==='stSel'){
      var id=t.dataset.id,v=t.value;
      if(v==='selected'&&!await ask({title:'انتخاب ایده',msg:'ایده «منتخب برای بررسی تخصصی» می‌شود و رأی‌گیری آن بسته خواهد شد.',ok:'تأیید'})){render();return}
      var r=await sb.rpc('admin_set_idea_status',{p_idea:id,p_status:v});if(r.error)throw r.error;
      toast('وضعیت ایده تغییر کرد.');await loadData();render();return;
    }
    if(t.id==='ownSel'&&t.value){
      if(!await ask({title:'تغییر پیشنهاددهنده',msg:'مالک این ایده تغییر می‌کند و در گزارش مدیر ثبت می‌شود.',ok:'تأیید'})){render();return}
      var r3=await sb.rpc('admin_assign_owner',{p_idea:t.dataset.id,p_user:t.value});if(r3.error)throw r3.error;
      toast('پیشنهاددهنده ثبت شد.');await loadAdmin();render();return;
    }
    if(t.dataset&&t.dataset.link&&t.value){
      var nm=t.options[t.selectedIndex].text;
      if(!await ask({title:'وصل‌کردن پروفایل قدیمی',msg:'«'+nm+'» به این حساب وصل می‌شود و رأی‌های قدیمی همان فرد به حساب او منتقل می‌شود. مطمئن هستید که این دو یک نفرند؟',ok:'وصل کن'})){render();return}
      var r2=await sb.rpc('admin_link_member',{p_user:t.dataset.link,p_member:t.value});if(r2.error)throw r2.error;
      toast('وصل شد؛ '+fa(r2.data)+' رأی قدیمی منتقل شد.');await loadAdmin();await loadData();render();return;
    }
  }catch(err){console.error(err);toast(errText(err),true);render()}
});
document.addEventListener('submit',async function(e){
  e.preventDefault();var f=e.target;
  try{
    if(f.id==='ideaForm'){var rt=route();return submitForm(rt.name==='edit'?rt.id:null)}
    if(f.id==='authForm'){
      var email=$('#a_email').value.trim(),pass=$('#a_pass').value,up=S.ui.authTab==='up';
      if(!email||!pass){S.ui.authMsg='!ایمیل و رمز عبور را وارد کنید.';render();return}
      if(up&&pass.length<8){S.ui.authMsg='!رمز عبور باید دست‌کم ۸ نویسه باشد.';render();return}
      S.ui.busy=true;S.ui.authMsg='';
      var res;
      if(up){var nm=($('#a_name')||{}).value||'';if(!nm.trim()){S.ui.busy=false;S.ui.authMsg='!نام را وارد کنید.';render();return}
        res=await sb.auth.signUp({email:email,password:pass,options:{data:{display_name:nm.trim()}}})}
      else res=await sb.auth.signInWithPassword({email:email,password:pass});
      S.ui.busy=false;
      if(res.error){S.ui.authMsg='!'+errText(res.error);render();return}
      if(up&&!res.data.session){S.ui.authTab='in';S.ui.authMsg='ثبت‌نام انجام شد. اگر ایمیل تأیید برایتان آمد آن را باز کنید، سپس وارد شوید.';render();return}
      S.session=res.data.session;await refresh();return;
    }
    if(f.id==='profileForm'){
      var dd=S.prof.draft,pl={job_title:dd.job_title.trim(),interests:dd.interests.trim(),skills:dd.skills.trim(),constraints:dd.constraints.trim(),team_roles:dd.team_roles,risk:dd.risk?String(dd.risk):'',horizon_months:dd.horizon_months?String(dd.horizon_months):''};
      var bad=null;['hours_per_week','capital_toman','max_loss_toman'].forEach(function(k){var n=normNum(dd[k]);if(n===null)bad=k;pl[k]=n||''});
      if(bad){toast('عددها را فقط با رقم و بدون منفی وارد کنید.',true);return}
      if(pl.capital_toman&&pl.max_loss_toman&&Number(pl.max_loss_toman)>Number(pl.capital_toman)){toast('حداکثر زیان نمی‌تواند از سرمایه بیشتر باشد.',true);return}
      S.ui.busy=true;render();
      var rp=await sb.rpc('save_my_profile',{p:pl});S.ui.busy=false;if(rp.error)throw rp.error;
      S.prof.draft=null;await loadData();toast('پروفایل ذخیره شد.');render();return;
    }
    if(f.id==='nameForm'){
      var r=await sb.rpc('update_my_name',{p_name:$('#nm').value});if(r.error)throw r.error;
      toast('نام ذخیره شد.');await loadProfile();render();return;
    }
    if(f.id==='deepForm'){
      var rt2=route(),deep={};$$('[data-d]',f).forEach(function(x){deep[x.dataset.d]=x.value.trim()});
      var r2=await sb.rpc('admin_save_deep',{p_idea:rt2.id,p:deep});if(r2.error)throw r2.error;
      toast('بررسی تخصصی ذخیره شد.');await loadData();render();return;
    }
  }catch(err){S.ui.busy=false;console.error(err);toast(errText(err),true);render()}
});

/* ================= شروع ================= */
async function boot(){
  if(!window.supabase){$('#app').innerHTML='<div class="authwrap"><div class="authcard"><h2>اتصال برقرار نشد</h2><p class="sub">بارگذاری سرویس ناموفق بود. اینترنت را بررسی کنید و صفحه را دوباره باز کنید.</p></div></div>';return}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  window.__radar={sb:sb,S:S};
  var g=await sb.auth.getSession();S.session=g.data&&g.data.session;
  sb.auth.onAuthStateChange(function(ev,sess){
    var prev=S.session&&S.session.user&&S.session.user.id,cur=sess&&sess.user&&sess.user.id;
    S.session=sess;
    if(prev!==cur)setTimeout(refresh,0);
  });
  window.addEventListener('focus',function(){if(S.session&&S.profile&&S.profile.status==='approved')loadData().then(function(){if(!S.ui.form)render()}).catch(function(){})});
  await refresh();
}
boot();
})();
</script>
