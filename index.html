<style>
/* Layout: right-hand navy sidebar (bottom tab bar on phones) + a content column of summary-first panels.
   Palette: deep navy structure, teal accent, semantic green/amber/red used only with a text label. */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --surface-2:#f7f9fb; --fg:#10212e; --muted:#566877; --line:#d9e2e8; --line-strong:#b9c7d1;
  --navy:#12324a; --accent:#0c8686; --accent-soft:#dcf1f0; --accent-fg:#ffffff;
  --good:#16764d; --good-bg:#e0f3ea; --warn:#8f5400; --warn-bg:#fcefd0; --bad:#b3261e; --bad-bg:#fbe3e1; --na:#4d5f6d; --na-bg:#e8eef2;
  --side-bg:#12324a; --side-fg:#d6e4ee; --side-mute:#8fb0c6; --side-on:rgba(255,255,255,.12);
  --shadow:0 1px 2px rgba(16,33,46,.06),0 4px 14px rgba(16,33,46,.05);
  --font:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b151d; --surface:#122029; --surface-2:#0f1b24; --fg:#e5edf2; --muted:#93a6b3; --line:#25384640; --line:#253846; --line-strong:#3a5162;
  --navy:#8cc2e6; --accent:#3cc4bf; --accent-soft:#12383a; --accent-fg:#04211f;
  --good:#52c78e; --good-bg:#123425; --warn:#e8b25a; --warn-bg:#3b2d10; --bad:#ff948b; --bad-bg:#3e1b19; --na:#a2b4c0; --na-bg:#1b2c37;
  --side-bg:#08121a; --side-fg:#cfdde7; --side-mute:#7f98a8; --side-on:rgba(255,255,255,.09);
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b151d; --surface:#122029; --surface-2:#0f1b24; --fg:#e5edf2; --muted:#93a6b3; --line:#253846; --line-strong:#3a5162;
  --navy:#8cc2e6; --accent:#3cc4bf; --accent-soft:#12383a; --accent-fg:#04211f;
  --good:#52c78e; --good-bg:#123425; --warn:#e8b25a; --warn-bg:#3b2d10; --bad:#ff948b; --bad-bg:#3e1b19; --na:#a2b4c0; --na-bg:#1b2c37;
  --side-bg:#08121a; --side-fg:#cfdde7; --side-mute:#7f98a8; --side-on:rgba(255,255,255,.09);
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.7;margin:0;padding:0}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{background:var(--side-bg);color:var(--side-fg);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;align-self:start}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-size:19px;font-weight:800;color:#fff;letter-spacing:-.2px;display:block;line-height:1.2}
.brand small{color:var(--side-mute);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--side-fg);font-size:14.5px;font-weight:500}
.nav button:hover{background:var(--side-on)}
.nav button[aria-current="page"]{background:var(--side-on);color:#fff;font-weight:700;box-shadow:inset -3px 0 0 var(--accent)}
.nav svg{width:19px;height:19px;flex:none}
.side .who{margin-top:auto;font-size:12.5px;color:var(--side-mute);display:flex;flex-direction:column;gap:4px;padding:0 6px}
.content{padding:20px 28px 56px;display:flex;flex-direction:column;gap:16px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;font-weight:800;color:var(--navy)}
.savebox{font-size:13px;display:inline-flex;align-items:center;gap:6px;color:var(--muted);min-height:24px}
.savebox.ok{color:var(--good)}.savebox.err{color:var(--bad);font-weight:700}
.savebox svg{width:16px;height:16px}
.spin{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(-360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tabbar{display:none}
@media(max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .content{padding:14px 16px calc(84px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:20}
  .tabbar button{all:unset;box-sizing:border-box;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10.5px;color:var(--muted);cursor:pointer;text-align:center;border-radius:8px;line-height:1.3}
  .tabbar button[aria-current="page"]{color:var(--accent);font-weight:700;background:var(--accent-soft)}
  .tabbar svg{width:21px;height:21px}
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);min-width:0}
.panel>h2,.ph h2{margin:0;font-size:16.5px;color:var(--navy);font-weight:800}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px;margin:0}
.grid{display:grid;gap:12px;min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media(max-width:1100px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-size:26px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.3}
.tile span{font-size:12.5px;color:var(--muted)}
.tile.attn b{color:var(--warn)}
.btn{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:38px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.lbl{font-weight:700;font-size:14px;display:flex;gap:6px;align-items:baseline}
.req{color:var(--bad)}.opt{font-weight:400;font-size:12px;color:var(--muted)}
.in{width:100%;font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:8px 11px;min-height:40px}
textarea.in{min-height:78px;resize:vertical}
.fld.has-err .in{border-color:var(--bad)}
.err{color:var(--bad);font-size:13px;font-weight:500;display:flex;gap:5px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:13.5px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--fg);padding:5px 12px;border-radius:999px;cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--surface);font-weight:700}
.seg.num button{min-width:38px;padding:5px 0;border-radius:8px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:0}
.tabs button{font:inherit;font-weight:700;font-size:14px;border:0;background:transparent;color:var(--muted);padding:9px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;white-space:nowrap}
.tag svg{width:12px;height:12px}
.t-good{background:var(--good-bg);color:var(--good)}.t-warn{background:var(--warn-bg);color:var(--warn)}
.t-bad{background:var(--bad-bg);color:var(--bad)}.t-na{background:var(--na-bg);color:var(--na);border:1px dashed var(--line-strong)}
.t-info{background:var(--accent-soft);color:var(--accent)}
.chip{display:inline-block;font-size:12.5px;background:var(--na-bg);color:var(--fg);padding:1px 9px;border-radius:6px;margin:2px 0 2px 4px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12.5px;color:var(--muted);font-weight:500;text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .name{font-weight:700;color:var(--fg)}
.tbl .name small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.idx{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.idx b{font-size:17px;font-variant-numeric:tabular-nums;line-height:1.2}
.idx small{color:var(--muted);font-size:11.5px}
.meter{height:7px;background:var(--na-bg);border-radius:4px;overflow:hidden;min-width:60px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.meter.warn i{background:var(--warn)}.meter.bad i{background:var(--bad)}
.link{all:unset;color:var(--accent);cursor:pointer;font-weight:700}
.link:hover{text-decoration:underline}.link:focus-visible{outline:2px solid var(--accent)}
.tblw{overflow-x:auto;max-width:100%}
@media(max-width:760px){
  .stack thead{display:none}
  .stack,.stack tbody,.stack tr,.stack td{display:block;width:100%}
  .stack tr{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px;background:var(--surface)}
  .stack td{border:0;padding:5px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}
  .stack td::before{content:attr(data-l);color:var(--muted);font-size:12.5px;flex:none}
  .stack td.first{display:block;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .stack td.first::before{display:none}
  .stack td.acts{justify-content:flex-start}.stack td.acts::before{display:none}
}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.opp{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:9px;background:var(--surface-2);min-width:0}
.opp h3{margin:0;font-size:16px;color:var(--navy)}
.opp .rank{font-size:12px;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini div{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.mini b{font-size:18px;color:var(--fg);font-variant-numeric:tabular-nums;line-height:1.2}
.empty{border:1px dashed var(--line-strong);border-radius:10px;padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg)}
.note{border:1px solid var(--line);border-inline-start:4px solid var(--warn);background:var(--surface);padding:10px 14px;border-radius:8px;font-size:14px;display:flex;gap:8px;align-items:flex-start}
.note.info{border-inline-start-color:var(--accent)}
.note.bad{border-inline-start-color:var(--bad)}
.rowitem{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.rowitem .bar{justify-content:space-between}
.sec{display:flex;flex-direction:column;gap:14px}
.crit{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.crit h3{margin:0;font-size:15px;color:var(--navy)}
.anch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12px;color:var(--muted)}
.anch span b{color:var(--fg);display:block}
@media(max-width:700px){.anch{grid-template-columns:1fr}}
.sticky-actions{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;box-shadow:var(--shadow);z-index:5}
@media(min-width:901px){.sticky-actions{bottom:12px}}
.ov{position:fixed;inset:0;background:rgba(8,18,26,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--surface);color:var(--fg);border-radius:12px;padding:20px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.dlg h3{margin:0;font-size:17px}.dlg p{margin:0;color:var(--muted)}
.cmp th:first-child,.cmp td:first-child{position:sticky;inset-inline-start:0;background:var(--surface);z-index:1;min-width:150px}
.cmp td,.cmp th{min-width:130px}
.kv{display:grid;grid-template-columns:minmax(110px,160px) minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:560px){.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}}
.chart text{fill:var(--muted);font-family:var(--font);font-size:10px}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.chart .dn{fill:var(--accent-fg);font-weight:700;font-size:9px}
.legendl{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legendl b{color:var(--accent)}
.sample{font-size:11px}
.lockmsg{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13.5px;background:var(--na-bg);padding:10px 12px;border-radius:8px}
details.h summary{cursor:pointer;font-weight:700;color:var(--navy)}
@media(prefers-reduced-motion:no-preference){.btn,.tag{transition:background .12s,border-color .12s}}
</style>

/* ================= scoring core (pure) ================= */
function indexOf(ids,eff,W){
  let all=0,known=0,sum=0;
  ids.forEach(id=>{const w=W[id]||0;all+=w;const v=eff[id].v;if(v!=null){known+=w;sum+=v*w}});
  const cov=all?known/all:0;
  return {score:known?sum/known*10:null,cov,known:ids.filter(id=>eff[id].v!=null).length,total:ids.length};
}
function crewOf(idea,votes,members){
  return Object.keys(votes||{}).filter(mk=>{const v=((votes[mk]||{}).votes||{})[idea.id];return members[mk]&&v&&(v.join==='yes'||v.join==='maybe')});
}
function autoScores(idea,ctx){
  const {members,priv,votes}=ctx, crew=crewOf(idea,votes,members), out={};
  const clamp=x=>Math.max(0,Math.min(10,x));
  // skill
  const req=tags(idea.requiredSkills);
  if(!req.length)out.skill={v:null,why:'مهارت‌های موردنیاز ایده ثبت نشده است.'};
  else if(!crew.length)out.skill={v:null,why:'هنوز عضوی اعلام نکرده که در این ایده شریک می‌شود.'};
  else{
    const best=req.map(r=>{let b=0;crew.forEach(mk=>(members[mk].skills||[]).forEach(s=>{const n=norm(s.name),q=norm(r);if(n&&q&&Number(s.level)&&(n.includes(q)||q.includes(n)))b=Math.max(b,Number(s.level))}));return b});
    out.skill={v:clamp(best.reduce((a,b)=>a+b/5,0)/req.length*10),why:`از ${fa(req.length)} مهارت موردنیاز، بهترین سطح اعضا: ${best.map(b=>fa(b)).join('، ')} از ۵`};
  }
  // time
  const need=toNum(idea.weeklyHours);
  if(need==null||isNaN(need)||need<=0)out.time={v:null,why:'زمان هفتگی موردنیاز ایده ثبت نشده است.'};
  else if(!crew.length)out.time={v:null,why:'هنوز عضوی اعلام نکرده که در این ایده شریک می‌شود.'};
  else{const avail=crew.reduce((s,mk)=>s+(Number(members[mk].hoursPerWeek)||0),0);
    out.time={v:clamp(avail/need/1.5*10),why:`${fa(avail)} ساعت قابل‌اختصاص در برابر ${fa(need)} ساعت موردنیاز`}}
  // capital
  const cap=toNum(idea.capital);
  if(cap==null||isNaN(cap))out.capital={v:null,why:'سرمایه‌ی اولیه‌ی تخمینی ثبت نشده است.'};
  else if(!crew.length)out.capital={v:null,why:'هنوز عضوی اعلام نکرده که در این ایده شریک می‌شود.'};
  else{
    const withP=crew.filter(mk=>priv[mk]&&priv[mk].capital!=null);
    if(!withP.length)out.capital={v:null,why:ENV.admin?'سرمایه‌ی اعضای علاقه‌مند در پروفایل‌ها ثبت نشده است.':'این محاسبه فقط برای مدیر در دسترس است.'};
    else if(cap===0)out.capital={v:10,why:'ایده سرمایه‌ی اولیه نیاز ندارد.'};
    else{const avail=withP.reduce((s,mk)=>s+(Number(priv[mk].capital)||0),0);
      out.capital={v:clamp(avail/cap*7),why:`${fa(avail)} میلیون تومان سرمایه‌ی قابل‌اختصاص در برابر ${fa(cap)} میلیون نیاز${withP.length<crew.length?' (برای '+fa(crew.length-withP.length)+' نفر داده‌ی سرمایه ثبت نشده)':''}`}}
  }
  return out;
}
const CORE_FIELDS=['title','problem','target','solution','product','revenue','industry','geo','advantage','capital','launchWeeks','weeklyHours','competitors','requiredSkills','risks'];
function dataCompleteness(i){
  let n=0,t=CORE_FIELDS.length+2+MKT.length;
  MKT.forEach(m=>{const x=(i.market||{})[m[0]];if(x&&String(x.text||'').trim())n++});
  CORE_FIELDS.forEach(f=>{const v=i[f];if(v!=null&&String(v).trim()!==''&&!(typeof v==='number'&&isNaN(v)))n++});
  if((i.assumptions||[]).some(a=>a.text))n++; if((i.evidence||[]).some(a=>a.text))n++;
  return n/t;
}
function computeIdea(idea,ctx){
  const W=ctx.weights, ev=(ctx.evals[idea.id]||{}).scores||{}, auto=autoScores(idea,ctx), eff={};
  CRIT.forEach(c=>{
    const m=ev[c.id];
    if(m&&m.v!=null&&!isNaN(m.v))eff[c.id]={v:Number(m.v),src:'manual',note:m.note||'',why:''};
    else if(c.auto&&auto[c.id]&&auto[c.id].v!=null)eff[c.id]={v:auto[c.id].v,src:'auto',note:(m&&m.note)||'',why:auto[c.id].why};
    else eff[c.id]={v:null,src:'missing',note:(m&&m.note)||'',why:c.auto&&auto[c.id]?auto[c.id].why:''};
  });
  const econ=indexOf(CRIT.filter(c=>c.g==='econ').map(c=>c.id),eff,W);
  const fit=indexOf(CRIT.filter(c=>c.g==='fit').map(c=>c.id),eff,W);
  const all=indexOf(CRIT.map(c=>c.id),eff,W);
  const src={manual:0,auto:0,missing:0};CRIT.forEach(c=>src[eff[c.id].src]++);
  const dc=dataCompleteness(idea);
  const cnt={hyp:0,init:0,val:0}; (idea.evidence||[]).forEach(e=>{if(e.text&&cnt[e.type]!=null)cnt[e.type]++});
  const pts=cnt.init*EPOINTS.init+cnt.val*EPOINTS.val;
  const val={score:Math.min(100,pts/ETARGET*100),cnt};
  const votes=Object.keys(ctx.votes).map(mk=>({mk,v:((ctx.votes[mk]||{}).votes||{})[idea.id]})).filter(x=>x.v&&ctx.members[x.mk]);
  const rated=votes.filter(x=>x.v.interest);
  const interest=rated.length?rated.reduce((s,x)=>s+Number(x.v.interest),0)/rated.length:null;
  const crew=votes.filter(x=>x.v.join==='yes'||x.v.join==='maybe');
  const joinYes=votes.filter(x=>x.v.join==='yes').length;
  const eligible=all.cov>=.7&&econ.cov>=.6&&fit.cov>=.6;
  const combined=eligible?.4*econ.score+.3*fit.score+.3*val.score:null;
  let cp=0;cp+=all.cov>=.8?2:all.cov>=.5?1:0;cp+=cnt.val>=2?2:cnt.val>=1?1:0;cp+=dc>=.7?1:0;
  const conf=cp>=4?'high':cp>=2?'med':'low';
  const missing=CRIT.filter(c=>eff[c.id].v==null).map(c=>c.name.replace(/ \(.*\)/,''));
  const whyNot=eligible?'':`برای رتبه‌بندی دست‌کم ۷۰٪ وزن معیارها (و ۶۰٪ هر شاخص) باید امتیاز داشته باشد؛ اکنون ${fa(all.cov*100)}٪ است. نیازمند بررسی: ${missing.join('، ')||'—'}`;
  let stage;
  if(idea.archived)stage='archived';
  else if(['validating','paused','launched'].includes(idea.status))stage=idea.status;
  else if(all.cov<.6)stage='insufficient';
  else if(eligible&&econ.score>=60&&fit.score>=50)stage='ready';
  else stage='evaluating';
  const notes=[];
  const known=CRIT.filter(c=>eff[c.id].v!=null).sort((a,b)=>eff[b.id].v-eff[a.id].v);
  if(known.length){const t=known[0];notes.push(`قوی‌ترین معیار: ${t.name.replace(/ \(.*\)/,'')} (${fa(eff[t.id].v,1)})`);
    const w=known[known.length-1];if(known.length>1&&eff[w.id].v<5)notes.push(`ضعیف‌ترین معیار: ${w.name.replace(/ \(.*\)/,'')} (${fa(eff[w.id].v,1)})`)}
  const miss=CRIT.length-known.length; if(miss)notes.push(`${fa(miss)} معیار نیازمند بررسی است`);
  notes.push(cnt.val?`${fa(cnt.val)} شاهد معتبر ثبت شده`:'هنوز شاهد معتبری از مشتری ثبت نشده');
  return {idea,eff,econ,fit,all,val,interest,nRated:rated.length,crew:crew.map(x=>x.mk),joinYes,combined,stage,notes,dc,eligible,conf,src,missing,whyNot};
}
function ctxNow(){return {members:S.members,priv:S.members_private,votes:S.votes,evals:S.evals,weights:weights()}}
const normIdea=(i,id)=>{const o=Object.assign({},i,{id});
  if(o.geo==null&&o.region)o.geo=o.region;
  if(!o.industry&&o.cat&&LCATS[o.cat])o.industry=LCATS[o.cat];
  if(!o.solution&&o.desc)o.solution=o.desc;
  return o};
const ideasList=()=>Object.entries(S.ideas).map(([id,i])=>normIdea(i,id));
const ideaOf=id=>S.ideas[id]?normIdea(S.ideas[id],id):null;
function computeAll(){const c=ctxNow();return ideasList().map(i=>computeIdea(i,c))}

function bandTag(kind,scale100){ // returns tag html for an index/score

  const m=map[kind];return `<span class="tag t-${m[1]}">${ico(m[2])}${m[0]}</span>`;
}
const critBand=v=>band(v==null?null:v*10,70,40);
function idxCell(ix,showCov=true){
  if(ix.score==null||ix.cov<.5)return `<div class="idx"><span class="tag t-na">${ico('info')}نیازمند بررسی</span>${ix.cov>0?`<small>${fa(ix.cov*100)}٪ داده</small>`:''}</div>`;
  return `<div class="idx"><b>${fa(ix.score)}</b>${bandTag(band(ix.score))}${showCov&&ix.cov<.8?`<small>بر پایه‌ی ${fa(ix.cov*100)}٪ داده</small>`:''}</div>`;
}
function valCell(v){const k=v.score>=60?'good':v.score>=25?'warn':'bad';const lbl=k==='good'?'قوی':k==='warn'?'در حال شکل‌گیری':'ضعیف';
  return `<div class="idx"><b>${fa(v.score)}</b><span class="tag t-${k}">${ico(k==='good'?'check':'alert')}${lbl}</span><small>${fa(v.cnt.val)} معتبر · ${fa(v.cnt.init)} اولیه · ${fa(v.cnt.hyp)} فرضیه</small></div>`}
const STAGE={insufficient:['اطلاعات ناکافی','na','info'],evaluating:['در حال ارزیابی','warn','scale'],ready:['آماده‌ی اعتبارسنجی','good','check'],validating:['در حال اعتبارسنجی','info','flask'],paused:['متوقف','na','alert'],launched:['راه‌اندازی‌شده','good','check'],archived:['آرشیو','na','archive']};
const stageTag=s=>{const m=STAGE[s];return `<span class="tag t-${m[1]}">${ico(m[2])}${m[0]}</span>`};
const confTag=c=>{const m=CONFL[c];return `<span class="tag t-${m[1]}">${ico(m[2])}سطح اطمینان ${m[0]}</span>`};
const srcTxt=r=>`${fa(r.src.manual)} قضاوت دستی · ${fa(r.src.auto)} محاسبه‌شده · ${fa(r.src.missing)} نیازمند بررسی`;

const L={get(c){try{return JSON.parse(localStorage.getItem('radar2:'+c)||'{}')}catch(e){return {}}},put(c,o){try{localStorage.setItem('radar2:'+c,JSON.stringify(o))}catch(e){throw {code:'quota_exceeded'}}}};
async function dbSet(col,id,data){
  data=clone(data);
  if(ENV.mode==='local'){const o=L.get(col);o[id]=data;L.put(col,o);S[col][id]=data;return}
  await ENV.db.doc(col+'/'+id).set(data);
}
async function dbDel(col,id){
  if(ENV.mode==='local'){const o=L.get(col);delete o[id];L.put(col,o);delete S[col][id];return}
  await ENV.db.doc(col+'/'+id).delete();
}
function errMsg(e){const c=e&&e.code;
  if(c==='invalid_argument')return 'دسترسی نوشتن ندارید. از مالک صفحه بخواهید سطح شما را «Contributor» کند.';
  if(c==='quota_exceeded')return 'ظرفیت ذخیره‌سازی پر شده است. چند مورد قدیمی را حذف کنید.';
  if(c==='revoked')return 'دسترسی شما به این صفحه تغییر کرده است. صفحه را دوباره باز کنید.';
  return 'ارتباط با ذخیره‌سازی برقرار نشد. دوباره تلاش کنید.';}
let saveClear=null;
function renderSave(){
  const b=$('#savebox'),s=UI.save;b.className='savebox'+(s.st==='saved'?' ok':s.st==='error'?' err':'');
  b.innerHTML=s.st==='saving'?`${ico('spin','spin')}در حال ذخیره…`:s.st==='saved'?`${ico('check')}ذخیره شد`:s.st==='error'?`${ico('alert')}خطا در ذخیره‌سازی: ${esc(s.msg)}`:ENV.mode==='local'?`${ico('info')}ذخیره‌ی محلی`:'';

async function persist(fn){
  clearTimeout(saveClear);UI.save={st:'saving'};renderSave();
  try{await fn();UI.save={st:'saved'};renderSave();saveClear=setTimeout(()=>{if(UI.save.st==='saved'){UI.save={st:'idle'};renderSave()}},3500);return true}

}

async function leaveGuard(){
  if(!(UI.dirty&&UI.draft))return true;
  return ask({title:'تغییرات ذخیره‌نشده',msg:'اگر خارج شوید، تغییرات این فرم از بین می‌رود.',ok:'خروج بدون ذخیره',danger:true});
}
function ask({title,msg,ok='تأیید',danger=false}){
  return new Promise(res=>{
    const d=$('#dlg');
    d.innerHTML=`<div class="ov"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dt"><h3 id="dt">${esc(title)}</h3><p>${esc(msg)}</p><div class="bar"><button class="btn ${danger?'danger':'primary'}" data-d="ok">${esc(ok)}</button><button class="btn" data-d="no" id="dno">لغو</button></div></div></div>`;
    const done=v=>{d.innerHTML='';document.removeEventListener('keydown',kd);res(v)};
    const kd=e=>{if(e.key==='Escape')done(false)};
    document.addEventListener('keydown',kd);
    d.querySelector('[data-d=ok]').onclick=()=>done(true);d.querySelector('[data-d=no]').onclick=()=>done(false);
    d.querySelector('#dno').focus();
  });
}

      </div><div class="bar">${sampleBtn()}<span class="hint">داده‌ی نمونه با برچسب «نمونه» مشخص می‌شود و از تنظیمات قابل حذف است.</span></div></div>`;

    :`<div class="empty"><b>هنوز ایده‌ای برای پیشنهاد آماده نیست</b><span>برای جلوگیری از رتبه‌بندی بدون پشتوانه، یک ایده وقتی پیشنهاد می‌شود که دست‌کم ۷۰٪ وزن معیارها (و ۶۰٪ هر یک از دو شاخص اقتصادی و تناسب) امتیاز داشته باشد.</span>${act.length?`<button class="btn primary" data-nav="eval">ارزیابی ایده‌ها</button>`:`<button class="btn primary" data-nav="ideas">ثبت اولین ایده</button>`}</div>`;
  const hours=mem.reduce((s,m)=>s+(Number(m.hoursPerWeek)||0),0), alloc=allocatedAll();
  const todo=[];
  if(cnt('insufficient'))todo.push(`${fa(cnt('insufficient'))} ایده اطلاعات کافی برای ارزیابی ندارد`);
  const noProf=mem.filter(m=>!m.hoursPerWeek&&m.hoursPerWeek!==0).length; if(noProf)todo.push(`${fa(noProf)} عضو ساعت هفتگی خود را ثبت نکرده است`);

function allocatedAll(){return Object.keys(S.members).reduce((s,k)=>s+allocatedOf(k),0)}

const memberPct=(m,p)=>{const f=[m.name,m.jobTitle,m.jobStatus,m.hoursPerWeek,(m.teamRoles||[]).length,(m.skills||[]).length,(m.projects||[]).length,m.industries,m.interests,m.network,m.clientAccess];let n=f.filter(v=>v!=null&&v!==''&&v!==0&&v!==false).length,t=f.length;
  if(p){const g=[p.capital,p.maxLoss,p.risk,p.horizon,p.quit,p.constraints];n+=g.filter(v=>v!=null&&v!=='').length;t+=g.length}return n/t};
function vMembers(){
  if(UI.id==='new'||(UI.id&&UI.draft))return vMemberForm();
  if(UI.id)return vMemberView(UI.id);
  const q=norm(UI.q), list=Object.entries(S.members).map(([id,m])=>({id,...m})).filter(m=>!q||norm(m.name+' '+(m.jobTitle||'')+' '+(m.skills||[]).map(s=>s.name).join(' ')).includes(q)).sort((a,b)=>String(a.name).localeCompare(String(b.name),'fa'));

function secOf(path){const f=path.split('.')[0];return {name:'basic',hoursPerWeek:'basic',jobStatus:'basic',skills:'skills',projects:'exp',_p:'res'}[f]||''}
function validateMember(d){
  const e={};
  if(!String(d.name||'').trim())e.name='نام را وارد کنید.';
  const h=d.hoursPerWeek; if(h==null||h==='')e.hoursPerWeek='ساعت هفتگی را وارد کنید. اگر وقت ندارید، عدد ۰ را بنویسید.';
  else if(isNaN(h)||h<0||h>80)e.hoursPerWeek='عددی بین ۰ تا ۸۰ وارد کنید.';
  const p=d._p||{};
  ['capital','maxLoss'].forEach(k=>{if(p[k]!=null&&p[k]!==''&&(isNaN(p[k])||p[k]<0))e['_p.'+k]='عدد معتبر و غیرمنفی وارد کنید.'});
  if(!e['_p.capital']&&!e['_p.maxLoss']&&p.capital!=null&&p.maxLoss!=null&&p.maxLoss>p.capital)e['_p.maxLoss']='حداکثر زیان نمی‌تواند از سرمایه‌ی قابل‌اختصاص بیشتر باشد.';
  (d.skills||[]).forEach((s,i)=>{if(!String(s.name||'').trim()&&(s.evidence||s.level))e[`skills.${i}.name`]='نام مهارت را بنویسید یا ردیف را حذف کنید.'});
  return e;
}
async function saveMember(){
  const d=UI.draft;d.name=String(d.name||'').trim();
  UI.errors=validateMember(d);
  if(Object.keys(UI.errors).length){const first=Object.keys(UI.errors)[0];UI.sec=secOf(first)||UI.sec;render();const el=$('#'+fid(first));if(el)el.focus();return}
  const id=UI.id==='new'?(UI.mineNew?myKey():newId('m')):UI.id;
  const p=d._p||{};const pub=clone(d);delete pub._p;
  pub.skills=(pub.skills||[]).filter(s=>String(s.name||'').trim()).map(s=>({...s,level:Number(s.level)||null}));
  pub.projects=(pub.projects||[]).filter(s=>String(s.title||'').trim());
  pub.updatedAt=Date.now();if(!pub.createdAt)pub.createdAt=Date.now();
  const priv=Object.assign({},p,{updatedAt:Date.now()});
  const ok=await persist(async()=>{await dbSet('members',id,pub);await dbSet('members_private',id,priv);
    if(ENV.mode!=='local'){S.members[id]=pub;S.members_private[id]=priv}});
  if(ok){UI.draft=null;UI.dirty=false;UI.id=id;UI.mineNew=false;render()}
}

function isecOf(p){const f=p.split('.')[0];return {market:'mkt',title:'core',problem:'core',target:'core',capital:'res',launchWeeks:'res',weeklyHours:'res',assumptions:'ev',evidence:'ev'}[f]||''}
function validateIdea(d){
  const e={};
  ['title','problem','target'].forEach(k=>{if(!String(d[k]||'').trim())e[k]={title:'عنوان ایده را بنویسید.',problem:'مسئله‌ی مشتری را بنویسید.',target:'مشتری هدف را مشخص کنید.'}[k]});
  [['capital',1e6,'سرمایه'],['launchWeeks',520,'زمان راه‌اندازی'],['weeklyHours',168,'زمان هفتگی']].forEach(([k,mx,n])=>{const v=d[k];if(v!=null&&v!==''&&(isNaN(v)||v<0||v>mx))e[k]=`${n}: عددی بین ۰ تا ${fa(mx)} وارد کنید.`});
  (d.evidence||[]).forEach((x,i)=>{if(!String(x.text||'').trim()&&(x.source))e[`evidence.${i}.text`]='متن شاهد را بنویسید یا ردیف را حذف کنید.'});
  MKT.forEach(([k])=>{const m=(d.market||{})[k];if(!m)return;
    if(String(m.text||'').trim()&&m.kind==='fact'&&!String(m.source||'').trim())e[`market.${k}.source`]='برای «واقعیت تأییدشده» منبع لازم است.';
    if(m.date&&!/^\d{4}-\d{2}-\d{2}$/.test(m.date))e[`market.${k}.date`]='تاریخ معتبر وارد کنید.'});
  return e;
}
async function saveIdea(){
  const d=UI.draft;UI.errors=validateIdea(d);
  if(Object.keys(UI.errors).length){const first=Object.keys(UI.errors)[0];UI.sec=isecOf(first)||UI.sec;render();const el=$('#'+fid(first));if(el)el.focus();return}
  const isNew=UI.id==='new',id=isNew?newId('i'):UI.id,o=clone(d);
  o.title=o.title.trim();o.updatedAt=Date.now();if(!o.createdAt)o.createdAt=Date.now();
  o.assumptions=(o.assumptions||[]).filter(a=>String(a.text||'').trim()).map(a=>({status:'untested',...a}));
  o.evidence=(o.evidence||[]).filter(a=>String(a.text||'').trim()).map(a=>({type:'hyp',...a}));
  o.status=o.status||'new';
  const mk2={};MKT.forEach(([k])=>{const m=(o.market||{})[k];if(m&&String(m.text||'').trim())mk2[k]={text:m.text.trim(),kind:m.kind||'assumption',conf:m.conf||'',source:String(m.source||'').trim(),date:m.date||''}});o.market=mk2;
  if(!Array.isArray(o.aiNotes))o.aiNotes=[];
  ['capital','launchWeeks','weeklyHours'].forEach(k=>{if(o[k]===''||isNaN(o[k]))o[k]=null});
  if(!o.createdBy)o.createdBy=myKey();
  const ok=await persist(async()=>{await dbSet('ideas',id,o);if(ENV.mode!=='local')S.ideas[id]=o});
  if(ok){UI.draft=null;UI.dirty=false;UI.id=id;UI.tab='overview';render()}
}

async function saveEval(id){
  const D=UI.evalDraft,errs={};

  UI.errors=errs;
  if(Object.keys(errs).length){render();const f=Object.keys(errs)[0].slice(2);const el=$('#note_'+f);if(el)el.focus();return}
  const scores={};CRIT.forEach(c=>{const m=D[c.id];if(m&&(m.v!=null||(m.note&&String(m.note).trim())))scores[c.id]={v:m.v==null?null:m.v,note:String(m.note||'').trim()}});
  const doc={ideaId:id,scores,updatedAt:Date.now(),by:myKey()};
  const ok=await persist(async()=>{await dbSet('evals',id,doc);if(ENV.mode!=='local')S.evals[id]=doc});

}

   <div class="meter" role="img" aria-label="${fa(prog)} درصد آزمون‌ها انجام شده"><i style="width:${prog}%"></i></div>
   <div class="seg" role="group" aria-label="فیلتر وضعیت">${[['','همه'],...TSTATUS,['late','عقب‌افتاده']].map(([k,l])=>`<button type="button" data-act="tf" data-v="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div></div>
  ${ideas.map(i=>{const ts=shown.filter(t=>t.ideaId===i.id);const r=computeIdea(i,ctxNow());if(!ts.length&&f)return '';

function testCard(t){
  const late=overdue(t), own=(S.members[t.owner]||{}).name||'';

function dl(filename,data,type){

  if(ENV.mode==='local'){fallback();return}
  (async()=>{try{const d=await window.claude.use('downloads');if(!d){if(msg)msg.textContent='ذخیره‌ی فایل در این نما ممکن نیست.';return}
    await d.save({filename,data});if(msg)msg.textContent='فایل ذخیره شد.'}catch(e){if(msg)msg.textContent=e&&e.code==='declined'?'ذخیره لغو شد.':'ذخیره‌ی فایل انجام نشد.'}})();

function knowledgeOf(i,r){
  const K={verified_facts:[],estimates:[],assumptions:[],unknowns:[],ai_suggestions:[],experiment_results:[]};
  const it=(text,x)=>Object.assign({text},x||{});
  MKT.forEach(([k,t])=>{const x=(i.market||{})[k];
    if(!x||!x.text){K.unknowns.push(it(t+': اطلاعاتی ثبت نشده',{topic:k}));return}
    const o=it(x.text,{topic:k,topic_title:t,source:x.source||null,date:x.date||null,confidence:x.conf||null});
    (x.kind==='fact'&&x.source?K.verified_facts:x.kind==='estimate'?K.estimates:x.kind==='unknown'?K.unknowns:K.assumptions).push(o)});
  (i.evidence||[]).forEach(e=>{if(!e.text)return;(e.type==='val'?K.verified_facts:e.type==='init'?K.estimates:K.assumptions).push(it(e.text,{source:e.source||null,evidence_level:e.type}))});
  (i.assumptions||[]).forEach(a=>{if(a.text)K.assumptions.push(it(a.text,{status:a.status||'untested',is_key_hypothesis:!!a.key}))});
  [['capital','سرمایه‌ی اولیه (میلیون تومان)'],['launchWeeks','زمان تا راه‌اندازی (هفته)'],['weeklyHours','زمان هفتگی لازم (ساعت)']].forEach(([f,t])=>{if(i[f]!=null&&i[f]!=='')K.estimates.push(it(t+': '+i[f],{field:f,value:i[f],source:'برآورد عضو'}))});
  r.missing.forEach(m=>K.unknowns.push(it('معیار «'+m+'» هنوز امتیاز ندارد (نیازمند بررسی)',{kind:'criterion'})));
  (i.aiNotes||[]).forEach(n=>K.ai_suggestions.push({text:n.text,generated_by:n.source||null,date:n.date||null,human_reviewed:!!n.reviewed,note:'تولیدشده توسط هوش مصنوعی؛ در هیچ امتیازی استفاده نشده'}));
  Object.values(S.tests).filter(t=>t.ideaId===i.id&&(t.status==='passed'||t.status==='failed')).forEach(t=>K.experiment_results.push({assumption:t.assumption,method:lab(METHODS,t.method)||null,success_metric:t.metric||null,failure_metric:t.failMetric||null,status:t.status,result:t.result||null,decision:t.decision||null,cost_million_toman:t.cost??null,duration_days:t.days??null,customer_group:t.customerGroup||null}));
  return K;
}

/* ---- safe import ---- */
const BADK=['__proto__','constructor','prototype'], IDRE=/^[A-Za-z0-9_\-.~:@+]{1,200}$/;
function cleanVal(v,d=0){
  if(d>12)return null;
  if(Array.isArray(v))return v.slice(0,500).map(x=>cleanVal(x,d+1));
  if(v&&typeof v==='object'){const o={};for(const k of Object.keys(v)){if(BADK.includes(k)||k.length>100)continue;o[k]=cleanVal(v[k],d+1)}return o}
  if(typeof v==='string')return v.slice(0,20000);
  if(typeof v==='number')return isFinite(v)?v:null;
  return (typeof v==='boolean'||v===null)?v:null;
}
const DOCCHK={ideas:d=>typeof d.title==='string'&&d.title.trim(),members:d=>typeof d.name==='string'&&d.name.trim(),votes:d=>d.votes&&typeof d.votes==='object',evals:d=>d.scores&&typeof d.scores==='object',tests:d=>typeof d.ideaId==='string',members_private:d=>true,config:d=>true};
function parseBackup(text,isAdmin){
  if(typeof text!=='string'||text.length>8e6)return {ok:false,error:'فایل خالی یا بیش از حد بزرگ است.'};
  let o;try{o=JSON.parse(text)}catch(e){return {ok:false,error:'فایل JSON معتبر نیست.'}}
  if(!o||typeof o!=='object'||o.app!=='radar-ide')return {ok:false,error:'این فایل پشتیبان رادار ایده نیست.'};
  if(![2,3].includes(o.version))return {ok:false,error:'نسخه‌ی این پشتیبان پشتیبانی نمی‌شود.'};
  const src=o.version===3?(o.data||{}):o;
  const docs={},warn=[];let total=0;
  for(const c of ['members','members_private','ideas','evals','votes','tests','config']){
    const m=src[c];if(m==null)continue;
    if(typeof m!=='object'||Array.isArray(m)){warn.push(`بخش ${c} ساختار معتبر ندارد و نادیده گرفته شد.`);continue}
    if(c==='members_private'&&!isAdmin){warn.push('اطلاعات خصوصی اعضا فقط توسط مدیر وارد می‌شود و نادیده گرفته شد.');continue}
    docs[c]={};
    for(const [id,d] of Object.entries(m)){
      if(!IDRE.test(id)||BADK.includes(id)||!d||typeof d!=='object'||Array.isArray(d)||!DOCCHK[c](d)){warn.push(`یک سند نامعتبر در ${c} رد شد.`);continue}
      if(c==='config'){if(id==='main'){const w=d.weights;const sm=w&&typeof w==='object'?Object.values(w).reduce((a,b)=>a+(Number(b)||0),0):NaN;if(!(Math.abs(sm-100)<.001)){warn.push('وزن‌های پشتیبان مجموع ۱۰۰ ندارد و رد شد.');continue}}else if(id!=='meta'){continue}}
      if(JSON.stringify(d).length>200000){warn.push(`سند ${id} بیش از حد بزرگ است و رد شد.`);continue}
      if(++total>5000){warn.push('تعداد اسناد از ۵۰۰۰ بیشتر است؛ ادامه نادیده گرفته شد.');break}
      docs[c][id]=cleanVal(d);
    }
  }
  if(!total)return {ok:false,error:'هیچ داده‌ی معتبری در فایل پیدا نشد.',warn};
  return {ok:true,docs,total,warn:[...new Set(warn)]};
}

    /* members */
    case 'newMember':UI.view='members';Object.assign(UI,{id:'new',draft:blankMember(),sec:'basic',errors:{},dirty:false,mineNew:false});return render();
    case 'newMine':{UI.view='members';const d=blankMember();Object.assign(UI,{id:'new',draft:d,sec:'basic',errors:{},dirty:false,mineNew:true});return render()}
    case 'openMember':UI.id=id;UI.draft=null;return render();
    case 'editMember':{const m=clone(S.members[id]);m._p=clone(S.members_private[id]||{capital:null,maxLoss:null,risk:null,horizon:null,quit:'',constraints:'',contact:''});UI.view='members';Object.assign(UI,{id,draft:m,sec:'basic',errors:{},dirty:false});return render()}
    case 'saveMember':return saveMember();
    case 'delMember':{if(!await ask({title:'حذف عضو',msg:'پروفایل و اطلاعات خصوصی این عضو و رأی‌های او حذف می‌شود. این کار بازگشت‌پذیر نیست.',ok:'حذف عضو',danger:true}))return;
      if(await persist(async()=>{await dbDel('members',id);await dbDel('members_private',id);await dbDel('votes',id);if(ENV.mode!=='local'){delete S.members[id];delete S.members_private[id];delete S.votes[id]}})){Object.assign(UI,{id:null,draft:null,dirty:false});render()}return}
    /* ideas */
    case 'newIdea':UI.view='ideas';Object.assign(UI,{id:'new',tab:'edit',draft:blankIdea(),sec:'core',errors:{},dirty:false});return render();
    case 'openIdea':if(!(await leaveGuard()))return;UI.view='ideas';Object.assign(UI,{id,tab:b.dataset.tab||'overview',draft:null,errors:{},dirty:false,evalDraft:null,votePick:null});render();window.scrollTo(0,0);return;
    case 'editIdea':Object.assign(UI,{view:'ideas',id,tab:'edit',draft:clone(ideaOf(id)),sec:'core',errors:{},dirty:false});return render();
    case 'saveIdea':return saveIdea();
    case 'itab':if(!(await leaveGuard()))return;Object.assign(UI,{tab:b.dataset.v,errors:{},evalDraft:null,draft:null,dirty:false});return render();
    case 'archIdea':{const i=clone(S.ideas[id]);i.archived=!i.archived;i.updatedAt=Date.now();if(await persist(async()=>{await dbSet('ideas',id,i);if(ENV.mode!=='local')S.ideas[id]=i}))render();return}
    case 'delIdea':{if(!await ask({title:'حذف ایده',msg:'ایده همراه با ارزیابی، رأی‌ها و آزمون‌هایش حذف می‌شود. اگر فقط می‌خواهید کنار بگذارید، آرشیو کنید.',ok:'حذف ایده',danger:true}))return;
      if(await persist(async()=>{await dbDel('ideas',id);await dbDel('evals',id);for(const [t,d] of Object.entries(S.tests))if(d.ideaId===id)await dbDel('tests',t);
        for(const [mk,d] of Object.entries(S.votes))if(d.votes&&d.votes[id]&&(ENV.admin||mk===myKey())){const c=clone(d);delete c.votes[id];await dbSet('votes',mk,c);if(ENV.mode!=='local')S.votes[mk]=c}
        if(ENV.mode!=='local'){delete S.ideas[id];delete S.evals[id]}})){Object.assign(UI,{id:null,tab:null});render()}return}
    /* eval */
    case 'score':{const c=b.dataset.c,v=b.dataset.v===''?null:Number(b.dataset.v);const D=UI.evalDraft;D[c]=Object.assign({},D[c]||{},{v});delete UI.errors['n_'+c];render();const el=$('#crit_'+c);if(el)el.scrollIntoView({block:'nearest'});return}
    case 'resetEval':UI.evalDraft=null;UI.errors={};return render();
    case 'saveEval':return saveEval(id);
    case 'cmp':{const s=UI.compare,i=s.indexOf(id);if(i>=0)s.splice(i,1);else if(s.length<4)s.push(id);else s.shift(),s.push(id);return render()}
    case 'vote':{const mk=UI.votePick&&S.members[UI.votePick]?UI.votePick:defVoter();const v=b.dataset.k==='interest'?Number(b.dataset.v):b.dataset.v;
      const cur=((S.votes[mk]||{}).votes||{})[UI.id]||{};setVote(mk,UI.id,{[b.dataset.k]:cur[b.dataset.k]===v?null:v});return}
    /* tests */
    case 'newTest':UI.testDraft={ideaId:'',method:'',assumption:'',metric:'',deadline:'',owner:'',status:'planned',result:''};UI.draft=UI.testDraft;UI.errors={};return render();
    case 'editTest':UI.testDraft=Object.assign({_id:id},clone(S.tests[id]));UI.draft=UI.testDraft;UI.errors={};return render();
    case 'saveTest':return saveTest();
    case 'useAssumption':UI.testDraft.assumption=b.dataset.v;return render();
    case 'tf':UI.tfilter=b.dataset.v;return render();
    case 'delTest':{if(!await ask({title:'حذف آزمون',msg:'این آزمون حذف می‌شود.',ok:'حذف',danger:true}))return;if(await persist(async()=>{await dbDel('tests',id);if(ENV.mode!=='local')delete S.tests[id]}))render();return}
    case 'logEvidence':{const t=clone(S.tests[id]),idea=clone(S.ideas[t.ideaId]);idea.evidence=(idea.evidence||[]).concat([{text:`${t.assumption}: ${t.result}`,type:'val',source:'آزمون اعتبارسنجی ('+(lab(TSTATUS,t.status))+')'}]);idea.updatedAt=Date.now();t.logged=true;
      if(await persist(async()=>{await dbSet('ideas',t.ideaId,idea);await dbSet('tests',id,t);if(ENV.mode!=='local'){S.ideas[t.ideaId]=idea;S.tests[id]=t}}))render();return}
    /* settings */
    case 'normW':{const W=UI.weightsDraft,s=Object.values(W).reduce((a,x)=>a+(Number(x)||0),0)||1;let acc=0;const ids=CRIT.map(c=>c.id);ids.forEach((k,i)=>{if(i<ids.length-1){W[k]=Math.round((Number(W[k])||0)/s*1000)/10;acc+=W[k]}else W[k]=Math.round((100-acc)*10)/10});return render()}
    case 'defW':UI.weightsDraft=Object.assign({},DEFW);return render();
    case 'saveW':{const W={};CRIT.forEach(c=>W[c.id]=Number(UI.weightsDraft[c.id])||0);const doc={weights:W,updatedAt:Date.now()};if(await persist(async()=>{await dbSet('config','main',doc);if(ENV.mode!=='local')S.config.main=doc}))UI.weightsDraft=null,render();return}
    case 'copyPrompt':return copyPrompt();
    case 'legacyGo':{const c=await legacyMigrate(!!($('#legStubs')&&$('#legStubs').checked));if(c){render();const m=$('#legMsg');if(m)m.textContent=`انتقال انجام شد: ${fa(c.members)} عضو، ${fa(c.votes)} فهرست رأی، ${fa(c.analysis)} تحلیل${c.stubs?'، '+fa(c.stubs)+' پروفایل ناقص':''}.`}return}
    case 'expJson':return expJson();
    case 'expCsv':return expCsv();
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){UI.q=t.value;const pos=t.selectionStart;render();const n=$('#q');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}
  if(t.dataset&&t.dataset.note&&UI.evalDraft){const c=t.dataset.note;UI.evalDraft[c]=Object.assign({},UI.evalDraft[c]||{},{note:t.value});delete UI.errors['n_'+c];const f=t.closest('.fld');if(f){f.classList.remove('has-err');const er=f.querySelector('.err');if(er)er.remove()}}
  if(t.dataset&&t.dataset.w&&UI.weightsDraft){UI.weightsDraft[t.dataset.w]=toNum(t.value);const W=UI.weightsDraft;const sum=Object.values(W).reduce((a,b)=>a+(Number(b)||0),0),ok=Math.abs(sum-100)<.001;const tag=$('.ph .tag');if(tag){tag.className='tag t-'+(ok?'good':'bad');tag.innerHTML=`${ico(ok?'check':'alert')}مجموع ${fa(sum,1)} از ۱۰۰`}$$('[data-act=saveW]').forEach(x=>x.disabled=!ok)}
  if(t.id==='vh'){const mk=UI.votePick&&S.members[UI.votePick]?UI.votePick:defVoter();const n=toNum(t.value);const msg=$('#vhe');
    if(t.value!==''&&(isNaN(n)||n<0||n>80)){msg.textContent='عددی بین ۰ تا ۸۰ وارد کنید.';msg.className='err';return}msg.textContent='';
    const cur=clone(S.votes[mk]||{votes:{}});cur.votes=cur.votes||{};cur.votes[UI.id]=Object.assign({},cur.votes[UI.id]||{},{hours:n==null?undefined:n});if(n==null)delete cur.votes[UI.id].hours;cur.updatedAt=Date.now();S.votes[mk]=cur;clearTimeout(voteT);voteT=setTimeout(()=>persist(()=>dbSet('votes',mk,cur)),600)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='stageSel'){UI.stage=t.value;render()}
  if(t.id==='sortSel'){UI.sort=t.value;render()}
  if(t.id==='archChk'){UI.showArch=t.checked;render()}
  if(t.id==='vp'){UI.votePick=t.value;render()}
  if(t.dataset&&t.dataset.tstatus){const id=t.dataset.tstatus,o=clone(S.tests[id]);o.status=t.value;o.updatedAt=Date.now();persist(async()=>{await dbSet('tests',id,o);if(ENV.mode!=='local')S.tests[id]=o}).then(()=>render())}
  if(t.id==='impFile'&&t.files[0]){importJson(t.files[0]);t.value=''}
  if(t.dataset&&t.dataset.b&&t.tagName==='SELECT'&&UI.view==='valid'&&t.dataset.b==='ideaId')render();
});
window.addEventListener('beforeunload',e=>{if(UI.dirty&&UI.draft){e.preventDefault();e.returnValue=''}});

/* ================= boot ================= */
(async function boot(){
  try{const v=sessionStorage.getItem('radar2:view');if(v&&PAGE_TITLE[v])UI.view=v}catch(e){}
  let db=null,user=null;
  try{if(window.claude&&window.claude.use){db=await window.claude.use('db');user=await window.claude.use('user')}}catch(e){db=null}
  let uid=null;try{uid=user&&await user.id()}catch(e){}
  if(db&&uid){
    ENV.mode='shared';ENV.db=db;ENV.uid=uid;
    try{ENV.isOwner=!!(await user.isOwner());ENV.admin=ENV.isOwner||!!(await user.canEdit())}catch(e){ENV.admin=false}
    try{const w=await user.can('data.write');ENV.canWrite=w!==false}catch(e){}
    let pend=COLS.length+1;const first=()=>{if(--pend<=0&&!UI.ready){UI.ready=true;render()}};
    COLS.forEach(c=>{let seen=false;db.collection(c).onSnapshot(s=>{S[c]=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));if(!seen){seen=true;first()}schedule()},()=>{if(!seen){seen=true;first()}})});
    let seenP=false;const pcb=()=>{if(!seenP){seenP=true;first()}schedule()};
    if(ENV.admin)db.collection('members_private').onSnapshot(s=>{S.members_private=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));pcb()},pcb);
    else db.doc('members_private/'+uid).onSnapshot(d=>{S.members_private=d.exists?{[uid]:d.data()}:{};pcb()},pcb);
    setTimeout(()=>{if(!UI.ready){UI.ready=true;render()}},5000);
    if(ENV.isOwner)legacyScan().then(()=>schedule());
  }else{
    ENV.mode='local';ENV.admin=true;ENV.canWrite=true;ENV.uid='local';
    ['members','members_private','ideas','evals','votes','tests','config'].forEach(c=>S[c]=L.get(c));
    UI.ready=true;
  }
  render();
})();
})();
</script>
